# Reverse proxy: host port (default 80) -> Spring Boot container on the eventtracker-net network.
server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://eventtracker-app:8080;
        proxy_http_version 1.1;
        # Keep the original host and port so the app's redirects (e.g. after saving a form) stay on Nginx.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }
}
