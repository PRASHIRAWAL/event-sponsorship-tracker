# Reverse proxy: host port (default 80) -> Spring Boot container on the eventtracker-net network.
server {
    listen 80;
    server_name _;

    # Compress text responses (pages, CSS, JS, JSON and CSV exports)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json text/csv image/svg+xml;

    # Basic hardening headers for every response
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    proxy_http_version 1.1;
    # Keep the original host and port so the app's redirects (e.g. after saving a form) stay on Nginx.
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;

    # Stylesheets, scripts and the favicon change only with a new release; let browsers cache them for an hour.
    location ~* ^/(css|js)/|^/favicon\.svg$ {
        proxy_pass http://eventtracker-app:8080;
        expires 1h;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        proxy_pass http://eventtracker-app:8080;
    }
}
