<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Access denied')}"></head>
<body>
<header th:replace="~{fragments/header :: header('')}"></header>

<main class="page page-narrow">
    <div class="card error-page" id="access-denied">
        <p class="error-code">403</p>
        <h1 class="page-title">You don't have access to this</h1>
        <p class="muted">Your account has read-only access. Creating, editing and deleting events, sponsors and
            payments needs an admin account.</p>
        <div class="page-actions">
            <a class="btn btn-secondary" href="javascript:history.back()">Go back</a>
            <a class="btn btn-primary" th:href="@{/dashboard}">Go to Dashboard</a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
