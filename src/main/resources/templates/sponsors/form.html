<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${sponsorId == null} ? 'Add Sponsor | Event Sponsorship Tracker' : 'Edit Sponsor | Event Sponsorship Tracker'">
        Sponsor | Event Sponsorship Tracker</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/header :: header('sponsors')}"></header>

<main class="container narrow">
    <h1 th:text="${sponsorId == null} ? 'Add Sponsor' : 'Edit Sponsor'">Add Sponsor</h1>

    <p class="alert alert-error" id="error-summary" th:if="${#fields.hasErrors('sponsor.*')}">
        Please correct the highlighted fields below.
    </p>

    <form id="sponsor-form" method="post" th:object="${sponsor}"
          th:action="${sponsorId == null} ? @{/sponsors} : @{/sponsors/{id}(id=${sponsorId})}">

        <div class="field">
            <label for="name">Sponsor Name <span class="required">*</span></label>
            <input type="text" id="name" th:field="*{name}" maxlength="150" required
                   th:classappend="${#fields.hasErrors('name')} ? 'invalid'">
            <p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Error</p>
        </div>

        <div class="field">
            <label for="contactPerson">Contact Person</label>
            <input type="text" id="contactPerson" th:field="*{contactPerson}" maxlength="100"
                   th:classappend="${#fields.hasErrors('contactPerson')} ? 'invalid'">
            <p class="field-error" th:if="${#fields.hasErrors('contactPerson')}" th:errors="*{contactPerson}">Error</p>
        </div>

        <div class="field-row">
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" th:field="*{email}" maxlength="150"
                       th:classappend="${#fields.hasErrors('email')} ? 'invalid'">
                <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Error</p>
            </div>

            <div class="field">
                <label for="phone">Phone</label>
                <input type="tel" id="phone" th:field="*{phone}" maxlength="20"
                       th:classappend="${#fields.hasErrors('phone')} ? 'invalid'">
                <p class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}">Error</p>
            </div>
        </div>

        <div class="field">
            <label for="eventId">Event</label>
            <select id="eventId" th:field="*{eventId}"
                    th:classappend="${#fields.hasErrors('eventId')} ? 'invalid'">
                <option value="">— Not linked to an event —</option>
                <option th:each="e : ${events}" th:value="${e.id}"
                        th:text="|${e.name} (${#temporals.format(e.eventDate, 'dd MMM yyyy')})|">Tech Fest</option>
            </select>
            <p class="field-error" th:if="${#fields.hasErrors('eventId')}" th:errors="*{eventId}">Error</p>
        </div>

        <div class="field-row">
            <div class="field">
                <label for="sponsorshipAmount">Sponsorship Amount</label>
                <input type="number" id="sponsorshipAmount" th:field="*{sponsorshipAmount}" min="0.01" step="0.01"
                       th:classappend="${#fields.hasErrors('sponsorshipAmount')} ? 'invalid'">
                <p class="field-error" th:if="${#fields.hasErrors('sponsorshipAmount')}"
                   th:errors="*{sponsorshipAmount}">Error</p>
            </div>

            <div class="field">
                <label for="sponsorshipStatus">Sponsorship Status <span class="required">*</span></label>
                <select id="sponsorshipStatus" th:field="*{sponsorshipStatus}" required
                        th:classappend="${#fields.hasErrors('sponsorshipStatus')} ? 'invalid'">
                    <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.label}">Proposed</option>
                </select>
                <p class="field-error" th:if="${#fields.hasErrors('sponsorshipStatus')}"
                   th:errors="*{sponsorshipStatus}">Error</p>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="button" id="save-sponsor"
                    th:text="${sponsorId == null} ? 'Add Sponsor' : 'Save Changes'">Save</button>
            <a class="button button-secondary" th:href="@{/sponsors}">Cancel</a>
        </div>
    </form>
</main>
</body>
</html>
