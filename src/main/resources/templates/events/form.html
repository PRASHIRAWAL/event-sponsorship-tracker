<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${event.id == null} ? 'Create Event | Event Sponsorship Tracker' : 'Edit Event | Event Sponsorship Tracker'">
        Event | Event Sponsorship Tracker</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/header :: header('events')}"></header>

<main class="container narrow">
    <h1 th:text="${event.id == null} ? 'Create Event' : 'Edit Event'">Create Event</h1>

    <p class="alert alert-error" id="error-summary" th:if="${#fields.hasErrors('event.*')}">
        Please correct the highlighted fields below.
    </p>

    <form id="event-form" method="post" th:object="${event}"
          th:action="${event.id == null} ? @{/events} : @{/events/{id}(id=${event.id})}">

        <div class="field">
            <label for="name">Event Name <span class="required">*</span></label>
            <input type="text" id="name" th:field="*{name}" maxlength="150" required
                   th:classappend="${#fields.hasErrors('name')} ? 'invalid'">
            <p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Error</p>
        </div>

        <div class="field">
            <label for="eventDate">Event Date <span class="required">*</span></label>
            <input type="date" id="eventDate" th:field="*{eventDate}" required
                   th:classappend="${#fields.hasErrors('eventDate')} ? 'invalid'">
            <p class="field-error" th:if="${#fields.hasErrors('eventDate')}" th:errors="*{eventDate}">Error</p>
        </div>

        <div class="field">
            <label for="venue">Venue <span class="required">*</span></label>
            <input type="text" id="venue" th:field="*{venue}" maxlength="150" required
                   th:classappend="${#fields.hasErrors('venue')} ? 'invalid'">
            <p class="field-error" th:if="${#fields.hasErrors('venue')}" th:errors="*{venue}">Error</p>
        </div>

        <div class="field">
            <label for="description">Description</label>
            <textarea id="description" th:field="*{description}" rows="4" maxlength="500"
                      th:classappend="${#fields.hasErrors('description')} ? 'invalid'"></textarea>
            <p class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">Error</p>
        </div>

        <div class="form-actions">
            <button type="submit" class="button" id="save-event"
                    th:text="${event.id == null} ? 'Create Event' : 'Save Changes'">Save</button>
            <a class="button button-secondary" th:href="@{/events}">Cancel</a>
        </div>
    </form>
</main>
</body>
</html>
