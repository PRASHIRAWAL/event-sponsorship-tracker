# Local development profile: in-memory H2 database (no MySQL needed) pre-filled with demo data.
# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# Data is lost when the application stops.
spring.datasource.url=jdbc:h2:mem:eventtracker_dev;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
app.demo-data=true
spring.thymeleaf.cache=false
# Demo accounts, shown on the sign-in page (never use these outside local development)
app.security.admin-password=${ADMIN_PASSWORD:admin123}
app.security.viewer-password=${VIEWER_PASSWORD:viewer123}
app.security.demo-hint=true
