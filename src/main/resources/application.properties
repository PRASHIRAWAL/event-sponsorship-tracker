# Application Configuration
spring.application.name=event-sponsorship-tracker
server.port=8080
# Gzip text responses (pages, CSS, JSON and CSV exports)
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json,text/csv

# Management & Health Check Endpoints (Actuator)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=Event Sponsorship Tracker
info.app.version=@project.version@
info.app.description=@project.description@
spring.thymeleaf.check-template-location=false

# Database Configuration (MySQL)
# Values can be overridden with the DB_URL, DB_USERNAME and DB_PASSWORD environment variables.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/eventsponsorship_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Seed sample events, sponsors and payments on an empty database (APP_DEMO_DATA=true). Never touches existing data.
app.demo-data=${APP_DEMO_DATA:false}
