# Application Configuration
spring.application.name=event-sponsorship-tracker
server.port=8080

# Management & Health Check Endpoints (Actuator)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
spring.thymeleaf.check-template-location=false

# Database Configuration (MySQL)
# Values can be overridden with the DB_URL, DB_USERNAME and DB_PASSWORD environment variables.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/eventsponsorship_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
