# Application Configuration
spring.application.name=event-sponsorship-tracker
server.port=8080
# Gzip text responses (pages, CSS, JSON and CSV exports)
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json,text/csv

# Management & Health Check Endpoints (Actuator)
management.endpoints.web.exposure.include=health,info
# Database and disk details are shown only to signed-in users; the UP/DOWN status stays public for health checks
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
info.app.name=Event Sponsorship Tracker
info.app.version=@project.version@
info.app.description=@project.description@
spring.thymeleaf.check-template-location=false

# Database Configuration (MySQL)
# Values can be overridden with the DB_URL, DB_USERNAME and DB_PASSWORD environment variables.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/eventsponsorship_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Seed sample events, sponsors and payments on an empty database (APP_DEMO_DATA=true). Never touches existing data.
app.demo-data=${APP_DEMO_DATA:false}

# Sign-in. ADMIN can change data, VIEWER is read-only. Set the passwords through environment variables.
# A blank ADMIN_PASSWORD generates a one-off password (printed in the log); a blank VIEWER_PASSWORD disables the viewer.
app.security.admin-username=${ADMIN_USERNAME:admin}
app.security.admin-password=${ADMIN_PASSWORD:}
app.security.viewer-username=${VIEWER_USERNAME:viewer}
app.security.viewer-password=${VIEWER_PASSWORD:}
# Signs "remember me" cookies; blank uses a random key, so those cookies stop working after a restart
app.security.remember-me-key=${REMEMBER_ME_KEY:}
# Lock an account for 15 minutes after 5 wrong passwords in a row
app.security.max-failed-attempts=5
app.security.lock-duration=15m
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
