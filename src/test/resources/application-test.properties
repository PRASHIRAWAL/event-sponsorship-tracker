# Test Profile: in-memory H2 database so tests run without a MySQL server
spring.datasource.url=jdbc:h2:mem:eventtracker_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
